name: "Create Kind Cluster"
description: "Creates a Kind cluster"
inputs:
  kind-version:
    required: false
    description: "Version of kind that should be used"
    # renovate: datasource=github-releases depName=kubernetes-sigs/kind
    default: "v0.32.0"
  k8s-version:
    required: false
    description: "Kubernetes version that should be used"
    # renovate: datasource=docker depName=kindest/node
    default: "v1.36.1"
  cluster-name:
    required: false
    description: "Name of the kind cluster"
    default: "kind"
  config:
    required: false
    description: "Config for the kind cluster"
    default: "./.github/actions/create-cluster/single-node.yaml"
  go-cache-dependency-path:
    required: false
    description: >
      go.sum of the Go module the job tests. Enables the Go module and build
      cache keyed on it. Leave empty for jobs that don't run Go tests, so they
      can't save a cache without the test build in it.
    default: ""
runs:
  using: "composite"
  steps:

    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: extension/opampconnectionextension/go.mod
        cache: ${{ inputs.go-cache-dependency-path != '' }}
        # The action file is part of the key so cluster jobs don't share a cache
        # with non-cluster jobs testing the same module, which lack the k8s deps.
        cache-dependency-path: |
          ${{ inputs.go-cache-dependency-path }}
          .github/actions/create-cluster/action.yaml

    - name: "Create single kind Cluster"
      uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
      with:
        cluster_name: ${{ inputs.cluster-name }}
        version: ${{ inputs.kind-version }}
        node_image: "kindest/node:${{ inputs.k8s-version }}"
        kubectl_version: ${{ inputs.k8s-version }}
        config: ${{ inputs.config }}
    
    - name: Download artifact
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: dynatrace-bindplane-otel-collector-image
        path: /tmp

    - name: Load Image into Kind
      shell: bash
      run: |
        kind load image-archive /tmp/dynatrace-bindplane-otel-collector.tar -n ${{ inputs.cluster-name }}
