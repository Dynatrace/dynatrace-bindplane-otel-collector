name: release
on:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: write

jobs:
  build-msi:
    uses: ./.github/workflows/build-signed-windows.yml
    with:
      version: ${{ github.ref_name }}
    secrets: inherit

  release:
    needs: [build-msi]
    runs-on:
      group: bindplane-large
      labels: ubuntu-latest-32-cores
    steps:
      - name: Redirect temp directories
        run: |
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "GOTMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          # For goreleaser
          fetch-depth: 0
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ secrets.DBDOT_GCS_RELEASE_BUCKET_PROJECT_ID }}
          credentials_json: ${{ secrets.DBDOT_GCS_RELEASE_BUCKET_CREDENTIALS }}
      - name: Install Gcloud SDK
        uses: google-github-actions/setup-gcloud@v2
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: internal/extension/opampconnectionextension/go.mod
          cache: false # Caching handled by the actions/cache step below
      - name: Set up Go cache
        uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - name: Grant access to private Dynatrace Go modules
        uses: ./.github/actions/private-go-modules
        with:
          app-id: ${{ vars.PRIVATE_GO_MODULES_APP_ID }}
          private-key: ${{ secrets.PRIVATE_GO_MODULES_APP_PRIVATE_KEY }}
      - name: Install ocb
        uses: nick-fields/retry@v4
        with:
          max_attempts: 3
          retry_wait_seconds: 30
          timeout_minutes: 10
          command: make install-ocb
      - name: Retrieve Windows AMD64 MSI Installer
        uses: actions/download-artifact@v8
        with:
          name: dynatrace-bindplane-otel-collector-amd64.msi
      - name: Retrieve Windows ARM64 MSI Installer
        uses: actions/download-artifact@v8
        with:
          name: dynatrace-bindplane-otel-collector-arm64.msi
      - name: Install cosign
        uses: nick-fields/retry@v4
        with:
          max_attempts: 3
          retry_wait_seconds: 30
          timeout_minutes: 10
          command: go install github.com/sigstore/cosign/cmd/cosign@v1.13.1
      - name: Build cosign key file
        run: 'echo "$COSIGN_PRIVATE_KEY" >> cosign.key'
        shell: bash
        env:
          COSIGN_PRIVATE_KEY: ${{secrets.COSIGN_PRIVATE_KEY}}
      - name: Cache Goreleaser Build
        uses: actions/cache@v6
        with:
          path: ~/.cache/goreleaser
          key: ${{ runner.os }}-goreleaser-${{ hashFiles('.goreleaser.yml', '**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-goreleaser-
      - name: Sign AMD64 MSI
        run: cosign sign-blob --key=cosign.key --output-signature ./dynatrace-bindplane-otel-collector-amd64.msi.sig ./dynatrace-bindplane-otel-collector-amd64.msi
        shell: bash
        env:
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PWD }}
      - name: Sign ARM64 MSI
        run: cosign sign-blob --key=cosign.key --output-signature ./dynatrace-bindplane-otel-collector-arm64.msi.sig ./dynatrace-bindplane-otel-collector-arm64.msi
        shell: bash
        env:
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PWD }}
      # The Windows binaries goreleaser packages must be the signed ones from
      # the build-msi job, not the unsigned copies its before-hook builds here.
      - name: Retrieve Signed Windows Binaries
        uses: actions/download-artifact@v4
        with:
          pattern: signed-windows-*
          merge-multiple: true
          path: signed-windows
      - name: Write signing key for nFPM
        shell: bash
        run: |
          cat > ci-signing-key.asc <<'EOF'
          ${{ secrets.GPG_PRIVATE_SIGNING_KEY }}
          EOF
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser-pro
          version: "v2.12.5"
          args: release --clean --timeout 120m
        env:
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
          SIGNED_WINDOWS_DIR: signed-windows
          COSIGN_PWD: ${{ secrets.COSIGN_PWD }}
          SIGNING_KEY_FILE: ci-signing-key.asc
      # Create artifact bundle and upload to release
      - name: Create artifact archive
        run: |
          mkdir artifacts
          cp ./scripts/install/*.sh ./artifacts
          cp ./scripts/install/*.ps1 ./artifacts
          cp ./release_deps/gpg-keys.tar.gz ./artifacts/gpg-keys.tar.gz
          cp ./dynatrace-bindplane-otel-collector-amd64.msi ./artifacts
          cp ./dynatrace-bindplane-otel-collector-arm64.msi ./artifacts
          cp ./dist/*tar.gz ./artifacts
          cp ./dist/*.zip ./artifacts
          cp ./dist/*.rpm ./artifacts
          cp ./dist/*.deb ./artifacts
          cp ./dist/*SHA256SUMS ./artifacts
          tar -czvf dynatrace-bindplane-otel-collector-${{ github.ref_name }}-artifacts.tar.gz -C ./artifacts .
      - name: Sign artifact archive
        run: cosign sign-blob --key=cosign.key --output-signature ./dynatrace-bindplane-otel-collector-${{ github.ref_name }}-artifacts.tar.gz.sig ./dynatrace-bindplane-otel-collector-${{ github.ref_name }}-artifacts.tar.gz
        shell: bash
        env:
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PWD }}
      - name: Upload Latest Install Scripts
        run: |
          gsutil cp ./scripts/install/install_unix.sh gs://dbdot-release/latest/install_unix.sh
          gsutil cp ./scripts/install/install_macos.sh gs://dbdot-release/latest/install_macos.sh
          gsutil cp ./scripts/install/install_windows.ps1 gs://dbdot-release/latest/install_windows.ps1
          gsutil cp ./release_deps/gpg-keys.tar.gz gs://dbdot-release/latest/gpg-keys.tar.gz
      - name: Upload artifact bundle to release
        uses: AButler/upload-release-assets@v2.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          files: "dynatrace-bindplane-otel-collector-${{ github.ref_name }}-artifacts.tar.gz*"
          release-tag: ${{ github.ref_name }}
      # TODO(dbdot): the installer testing repo does not exist yet. GITHUB_TOKEN
      # cannot dispatch to another repository; this needs a PAT or GitHub App
      # token once the repo exists.
      # - name: Trigger Installation Testing
      #   uses: peter-evans/repository-dispatch@v2
      #   with:
      #     token: ${{ secrets.GITHUB_TOKEN }}
      #     repository: TODO-DBDOT-INSTALLER-TESTING-REPO
      #     event-type: upstream_prerelease
      #     client-payload: '{ "version": "${{ github.ref_name }}" }'
