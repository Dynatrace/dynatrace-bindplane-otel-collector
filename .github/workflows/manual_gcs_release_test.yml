name: Test GCS Release Bucket
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test_gcs_release_bucket:
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ secrets.DBDOT_GCS_RELEASE_BUCKET_PROJECT_ID }}
          credentials_json: ${{ secrets.DBDOT_GCS_RELEASE_BUCKET_CREDENTIALS }}
      - name: Install Gcloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Test Gsutil
        run: gsutil ls gs://dbdot-release
      - run: gsutil cp LICENSE gs://dbdot-release/LICENSE
      - run: gsutil rm gs://dbdot-release/LICENSE
