name: CI - DBDOT

on:
  merge_group:
  push:
    branches:
      - main
    paths:
      - "manifests/dynatrace-bindplane-otel-collector/**"
      - "extension/**"
      - "pkg/**"
      - "Makefile"
      - ".github/workflows/base-ci.yaml"
      - ".github/workflows/ci-full.yaml"
      - ".github/actions/private-go-modules/**"
      # Covered by the unit tests (make test runs every module) and the tools
      # they need.
      - "updater/**"
      - "cmd/**"
      - "internal/tools/**"
      - ".github/scripts/retry.sh"
  pull_request:
    branches:
      - main
    paths:
      - "manifests/dynatrace-bindplane-otel-collector/**"
      - "extension/**"
      - "pkg/**"
      - "Makefile"
      - ".github/workflows/base-ci.yaml"
      - ".github/workflows/ci-full.yaml"
      - ".github/actions/private-go-modules/**"
      # Covered by the unit tests (make test runs every module) and the tools
      # they need.
      - "updater/**"
      - "cmd/**"
      - "internal/tools/**"
      - ".github/scripts/retry.sh"

permissions:
  contents: read

jobs:
  ci:
    name: CI - DBDOT
    # Dependabot PRs get no access to the private Go modules secret, so the
    # full build is skipped for them, as in checks.yml/tests.yml.
    # PRs from forks also lack the secret and fail here. Not handled since
    # the repo gets (almost) no fork PRs.
    if: github.actor != 'dependabot[bot]'
    uses: ./.github/workflows/base-ci.yaml
    with:
      distro: full
      private_go_modules: true
      run_tests: true
    secrets:
      PRIVATE_GO_MODULES_APP_PRIVATE_KEY: ${{ secrets.PRIVATE_GO_MODULES_APP_PRIVATE_KEY }}
      GRAPHITE_CI_OPTIMIZER_TOKEN: ${{ secrets.GRAPHITE_CI_OPTIMIZER_TOKEN }}
