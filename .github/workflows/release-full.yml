name: release-full

# Releases the full build from a plain semver tag. RC tags (vX.Y.Z-rc.N) are
# reserved for the slim build.
on:
  push:
    tags:
      - "v[0-9]*"
      - "!v*-*"

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
    uses: ./.github/workflows/base-release.yml
    with:
      product: dynatrace-bindplane-otel-collector
      version-check-mode: exact
      build-msi: true
      gcs: true
    secrets: inherit
