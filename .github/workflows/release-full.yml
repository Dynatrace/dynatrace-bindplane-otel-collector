name: release-full

# Releases the full build from a plain semver tag. RC tags (vX.Y.Z-rc.N) are
# reserved for the slim build.
on:
  push:
    tags:
      - "v[0-9]*"
      - "!v*-*"

permissions:
  contents: read

jobs:
  release:
    # Ceiling for the jobs of the reusable workflow, which request what they need.
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
      packages: write
    uses: ./.github/workflows/base-release.yml
    with:
      product: dynatrace-bindplane-otel-collector
      manifest: manifests/dynatrace-bindplane-otel-collector/manifest.yaml
      version-check-mode: exact
      goreleaser-config: manifests/dynatrace-bindplane-otel-collector/.goreleaser.yml
      build-msi: true
      build-aix: true
      gcs: true
      publish-latest-scripts: true
    secrets: inherit
