name: base-release

# Reusable release pipeline shared by the per-build release workflows
# (release-full.yml, release-slim.yml). Callers must pass `secrets: inherit` and
# grant the release job's permissions: `contents: write` to publish the GitHub
# release, `id-token` for keyless signing and `packages` for the container
# images, and for the attest job `attestations` and `artifact-metadata` write. A
# caller job's permissions are the ceiling of all jobs in this workflow, so
# callers grant the union. Each job here only requests what it needs.
on:
  workflow_call:
    inputs:
      product:
        description: "Product slug used in artifact names (e.g. dynatrace-bindplane-otel-collector)"
        required: true
        type: string
      manifest:
        description: "ocb manifest whose dist.version the tag is checked against"
        required: true
        type: string
      version-check-mode:
        description: "How the tag is compared to dist.version: exact or core (see scripts/ci/check-tag-version.sh)"
        required: true
        type: string
      goreleaser-config:
        description: "Path of the goreleaser config of the build"
        required: true
        type: string
      build-msi:
        description: "Build and sign the Windows MSIs, the signed Windows binaries and install script, and verify the signatures after the release"
        required: false
        type: boolean
        default: false
      gcs:
        description: "Authenticate to GCP and install the gcloud SDK, for the goreleaser GCS blob upload and publish-latest-scripts"
        required: false
        type: boolean
        default: false
      publish-latest-scripts:
        description: "Upload the install scripts and GPG keys to gs://dbdot-release/latest, requires gcs"
        required: false
        type: boolean
        default: false
      cosign-mode:
        description: "key signs with the cosign key file (.sig files), keyless signs with the workflow's OIDC identity (sigstore bundles) and attests the checksums and image digests"
        required: false
        type: string
        default: key
      containers:
        description: "Log in to Docker Hub, AWS ECR (public) and GHCR, and set up buildx and QEMU so goreleaser can push the container images"
        required: false
        type: boolean
        default: false
      sbom:
        description: "Install cyclonedx-gomod so goreleaser can generate SBOMs"
        required: false
        type: boolean
        default: false
      build-aix:
        description: "Build the AIX packages with .goreleaser-aix.yml and add them to the release"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check tag matches manifest version
        run: ./scripts/ci/check-tag-version.sh "$TAG" "$MANIFEST" "$MODE"
        env:
          TAG: ${{ github.ref_name }}
          MANIFEST: ${{ inputs.manifest }}
          MODE: ${{ inputs.version-check-mode }}

  build-msi:
    if: ${{ inputs.build-msi }}
    needs: [check-version]
    uses: ./.github/workflows/build-signed-windows.yml
    with:
      version: ${{ github.ref_name }}
      sign_install_script: true
    secrets: inherit

  release:
    needs: [check-version, build-msi, build-aix]
    # build-msi is skipped when the caller does not build MSIs; without a status
    # function a skipped dependency would skip this job too.
    if: ${{ !cancelled() && !failure() }}
    permissions:
      contents: write
      id-token: write
      packages: write
    runs-on:
      group: bindplane-large
      labels: ubuntu-latest-32-cores
    steps:
      - name: Redirect temp directories
        run: |
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "GOTMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # For goreleaser
          fetch-depth: 0
      - name: Authenticate to GCP
        if: ${{ inputs.gcs }}
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ secrets.DBDOT_GCS_RELEASE_BUCKET_PROJECT_ID }}
          credentials_json: ${{ secrets.DBDOT_GCS_RELEASE_BUCKET_CREDENTIALS }}
      - name: Install Gcloud SDK
        if: ${{ inputs.gcs }}
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: extension/opampconnectionextension/go.mod
          cache: false # Caching handled by the actions/cache step below
      - name: Set up Go cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - name: Grant access to private Dynatrace Go modules
        uses: ./.github/actions/private-go-modules
        with:
          app-id: ${{ vars.PRIVATE_GO_MODULES_APP_ID }}
          private-key: ${{ secrets.PRIVATE_GO_MODULES_APP_PRIVATE_KEY }}
      - name: Install ocb
        timeout-minutes: 10
        run: bash .github/scripts/retry.sh make install-ocb
      - name: Retrieve Windows AMD64 MSI Installer
        if: ${{ inputs.build-msi }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dynatrace-bindplane-otel-collector-amd64.msi
      - name: Retrieve Windows ARM64 MSI Installer
        if: ${{ inputs.build-msi }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dynatrace-bindplane-otel-collector-arm64.msi
      - name: Retrieve AIX Packages
        if: ${{ inputs.build-aix }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aix-dist
          path: aix-dist
      - name: Install cosign
        if: ${{ inputs.cosign-mode == 'key' }}
        timeout-minutes: 10
        run: bash .github/scripts/retry.sh go install github.com/sigstore/cosign/cmd/cosign@v1.13.1
      # Keyless signing needs cosign v2+, which creates sigstore bundles.
      - name: Install cosign (keyless)
        if: ${{ inputs.cosign-mode == 'keyless' }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - name: Build cosign key file
        if: ${{ inputs.cosign-mode == 'key' }}
        run: 'echo "$COSIGN_PRIVATE_KEY" >> cosign.key'
        shell: bash
        env:
          COSIGN_PRIVATE_KEY: ${{secrets.COSIGN_PRIVATE_KEY}}
      - name: Cache Goreleaser Build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/goreleaser
          key: ${{ runner.os }}-goreleaser-${{ hashFiles(inputs.goreleaser-config, '**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-goreleaser-
      - name: Sign AMD64 MSI
        if: ${{ inputs.build-msi }}
        run: cosign sign-blob --key=cosign.key --output-signature ./dynatrace-bindplane-otel-collector-amd64.msi.sig ./dynatrace-bindplane-otel-collector-amd64.msi
        shell: bash
        env:
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PWD }}
      - name: Sign ARM64 MSI
        if: ${{ inputs.build-msi }}
        run: cosign sign-blob --key=cosign.key --output-signature ./dynatrace-bindplane-otel-collector-arm64.msi.sig ./dynatrace-bindplane-otel-collector-arm64.msi
        shell: bash
        env:
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PWD }}
      # Staged into place by goreleaser's overlay before-hook, not here:
      # goreleaser validates git state before running its hooks, so touching
      # the tracked script from a workflow step fails the release with
      # "git is in a dirty state". The download directory is gitignored.
      - name: Retrieve Signed Windows Install Script
        if: ${{ inputs.build-msi }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-install-script
          path: signed-install-script
      # The Windows binaries goreleaser packages must be the signed ones from
      # the build-msi job, not the unsigned copies its before-hook builds here.
      - name: Retrieve Signed Windows Binaries
        if: ${{ inputs.build-msi }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: signed-windows-*
          merge-multiple: true
          path: signed-windows
      # Exported here instead of in the goreleaser step's env: the overlay script
      # treats a set-but-empty SIGNED_WINDOWS_DIR as an error, so for builds
      # without MSIs the variables must stay unset.
      - name: Export signed Windows paths
        if: ${{ inputs.build-msi }}
        run: |
          echo "SIGNED_WINDOWS_DIR=signed-windows" >> "$GITHUB_ENV"
          echo "SIGNED_INSTALL_SCRIPT=signed-install-script/install_windows.ps1" >> "$GITHUB_ENV"
      - name: Install cyclonedx-gomod
        if: ${{ inputs.sbom }}
        timeout-minutes: 10
        run: bash .github/scripts/retry.sh go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.12.0
      - name: Set up QEMU
        if: ${{ inputs.containers }}
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64,ppc64le
      - name: Set up Docker Buildx
        if: ${{ inputs.containers }}
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login to Github Container Registry
        if: ${{ inputs.containers }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Login to DockerHub Registry
        if: ${{ inputs.containers }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Configure AWS credentials
        if: ${{ inputs.containers }}
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: us-east-1
      - name: Login to Amazon ECR Public
        if: ${{ inputs.containers }}
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
        with:
          registry-type: public
      - name: Write signing key for nFPM
        shell: bash
        run: |
          cat > ci-signing-key.asc <<'EOF'
          ${{ secrets.GPG_PRIVATE_SIGNING_KEY }}
          EOF
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser-pro
          version: "v2.12.5"
          args: release --clean --timeout 120m --config ${{ inputs.goreleaser-config }}
        env:
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
          COSIGN_PWD: ${{ secrets.COSIGN_PWD }}
          SIGNING_KEY_FILE: ci-signing-key.asc
      # The attest job runs with its own permissions and only needs the lists of
      # checksums and image digests.
      - name: Upload attestation subjects
        if: ${{ inputs.cosign-mode == 'keyless' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: attestation-subjects
          path: |
            dist/${{ inputs.product }}-${{ github.ref_name }}-SHA256SUMS
            dist/digests.txt
          retention-days: 1
      # Create artifact bundles (all-platform plus one per OS) and upload to release
      - name: Create artifact archives
        run: ./scripts/ci/create-artifact-bundles.sh ${{ github.ref_name }} ${{ inputs.product }}
        env:
          # The install scripts and MSIs only exist for builds that ship them.
          BUNDLE_INSTALLERS: ${{ inputs.build-msi }}
      - name: Sign artifact archives
        if: ${{ inputs.cosign-mode == 'key' }}
        run: |
          for bundle in ./${{ inputs.product }}-${{ github.ref_name }}-artifacts*.tar.gz; do
            cosign sign-blob --key=cosign.key --output-signature "$bundle.sig" "$bundle"
          done
        shell: bash
        env:
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PWD }}
      - name: Sign artifact archives (keyless)
        if: ${{ inputs.cosign-mode == 'keyless' }}
        run: |
          for bundle in ./${{ inputs.product }}-${{ github.ref_name }}-artifacts*.tar.gz; do
            cosign sign-blob --bundle "$bundle.sigstore.json" --yes "$bundle"
          done
        shell: bash
      - name: Upload Latest Install Scripts
        if: ${{ inputs.publish-latest-scripts }}
        run: |
          gsutil cp ./scripts/install/install_unix.sh gs://dbdot-release/latest/install_unix.sh
          gsutil cp ./scripts/install/install_macos.sh gs://dbdot-release/latest/install_macos.sh
          gsutil cp ./scripts/install/install_windows.ps1 gs://dbdot-release/latest/install_windows.ps1
          gsutil cp ./release_deps/gpg-keys.tar.gz gs://dbdot-release/latest/gpg-keys.tar.gz
      - name: Upload artifact bundles to release
        uses: AButler/upload-release-assets@34491005a5d7ec239a784e460807ce844fde7962 # v4.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          files: "${{ inputs.product }}-${{ github.ref_name }}-artifacts*.tar.gz*"
          release-tag: ${{ github.ref_name }}
      # TODO(dbdot): the installer testing repo does not exist yet. GITHUB_TOKEN
      # cannot dispatch to another repository; this needs a PAT or GitHub App
      # token once the repo exists.
      # - name: Trigger Installation Testing
      #   uses: peter-evans/repository-dispatch@v2
      #   with:
      #     token: ${{ secrets.GITHUB_TOKEN }}
      #     repository: TODO-DBDOT-INSTALLER-TESTING-REPO
      #     event-type: upstream_prerelease
      #     client-payload: '{ "version": "${{ github.ref_name }}" }'

  # AIX builds from its own goreleaser config. The release job publishes the
  # packages and lists their hashes in the main SHA256SUMS.
  build-aix:
    if: ${{ inputs.build-aix }}
    needs: [check-version]
    runs-on:
      group: bindplane-large
      labels: ubuntu-latest-32-cores
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # For goreleaser
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: extension/opampconnectionextension/go.mod
          cache: false # Caching handled by the actions/cache step below

      - name: Set up Go cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Grant access to private Dynatrace Go modules
        uses: ./.github/actions/private-go-modules
        with:
          app-id: ${{ vars.PRIVATE_GO_MODULES_APP_ID }}
          private-key: ${{ secrets.PRIVATE_GO_MODULES_APP_PRIVATE_KEY }}

      - name: Install ocb
        timeout-minutes: 10
        run: bash .github/scripts/retry.sh make install-ocb

      - name: Install cosign
        timeout-minutes: 10
        run: bash .github/scripts/retry.sh go install github.com/sigstore/cosign/cmd/cosign@v1.13.1
      - name: Build cosign key file
        run: 'echo "$COSIGN_PRIVATE_KEY" >> cosign.key'
        shell: bash
        env:
          COSIGN_PRIVATE_KEY: ${{secrets.COSIGN_PRIVATE_KEY}}

      # The AIX install path verifies a detached GPG signature, so goreleaser
      # signs with gpg as well as cosign.
      - name: Import GPG signing key
        shell: bash
        run: |
          echo "$GPG_PRIVATE_SIGNING_KEY" | gpg --batch --import
          echo "GPG_FINGERPRINT=$(gpg --list-secret-keys --with-colons | grep fpr | head -1 | cut -d: -f10)" >> "$GITHUB_ENV"
        env:
          GPG_PRIVATE_SIGNING_KEY: ${{ secrets.GPG_PRIVATE_SIGNING_KEY }}

      - name: Run GoReleaser (AIX)
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser-pro
          version: "v2.12.5"
          args: release --config manifests/dynatrace-bindplane-otel-collector/.goreleaser-aix.yml --skip=publish --clean
        env:
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
          COSIGN_PWD: ${{ secrets.COSIGN_PWD }}
          GPG_FINGERPRINT: ${{ env.GPG_FINGERPRINT }}

      - name: Upload AIX Packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aix-dist
          path: dist/*.tar.gz*
          if-no-files-found: error
          retention-days: 1

  # Attests the checksums and the image digests of a keyless release. Kept apart
  # from the release job so that only this job holds the attestation permissions.
  attest:
    if: ${{ inputs.cosign-mode == 'keyless' }}
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download attestation subjects
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: attestation-subjects
          path: subjects
      - name: Attest binary artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ./subjects/${{ inputs.product }}-${{ github.ref_name }}-SHA256SUMS
      - name: Attest container images
        if: ${{ inputs.containers }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ./subjects/digests.txt

  # Gate the prerelease on the executables actually being signed, not just the
  # MSI. Releases publish as a prerelease first, so a failure here blocks
  # promotion instead of arriving after customers have the artifacts.
  verify-windows-release:
    if: ${{ inputs.build-msi }}
    needs: [release]
    runs-on: windows-2022
    steps:
      - name: Checkout Sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download Windows Release Artifacts
        run: |
          mkdir artifacts
          gh release download "$env:TAG" `
            --repo "$env:GITHUB_REPOSITORY" `
            --dir artifacts `
            --pattern "*-windows-*.zip" `
            --pattern "*.msi" `
            --pattern "install_windows.ps1"
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify Windows Signatures
        run: ./scripts/ci/verify-windows-signatures.ps1 -Root ./artifacts
        shell: pwsh
