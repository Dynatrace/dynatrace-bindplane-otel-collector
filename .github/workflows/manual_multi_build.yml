# Build is responsible for testing builds on all supported platforms.
# It is broken up into three separate jobs with targeted builds so that each OS will
# build in parallel and speed up overall CI time.
name: Build
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_linux:
    if: github.actor != 'dependabot[bot]'
    runs-on:
      group: bindplane-large
      labels: ubuntu-latest-4-cores
    steps:
      - name: Checkout Sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: internal/extension/opampconnectionextension/go.mod
          cache-dependency-path: |
            go.sum
            **/go.sum
      - name: Grant access to private Dynatrace Go modules
        uses: ./.github/actions/private-go-modules
        with:
          app-id: ${{ vars.PRIVATE_GO_MODULES_APP_ID }}
          private-key: ${{ secrets.PRIVATE_GO_MODULES_APP_PRIVATE_KEY }}
      - name: Install ocb
        timeout-minutes: 10
        run: bash .github/scripts/retry.sh make install-ocb
      - name: Build
        run: make build-linux
      - name: Install lichen
        timeout-minutes: 10
        run: bash .github/scripts/retry.sh go install github.com/uw-labs/lichen@v0.1.7
      - name: Scan Third Party Dependency Licenses
        run: lichen --config=./license.yaml $(find dist/collector_* dist/updater_*)
  build_darwin:
    if: github.actor != 'dependabot[bot]'
    runs-on: macos-14
    steps:
      - name: Checkout Sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: internal/extension/opampconnectionextension/go.mod
          cache-dependency-path: |
            go.sum
            **/go.sum
      - name: Grant access to private Dynatrace Go modules
        uses: ./.github/actions/private-go-modules
        with:
          app-id: ${{ vars.PRIVATE_GO_MODULES_APP_ID }}
          private-key: ${{ secrets.PRIVATE_GO_MODULES_APP_PRIVATE_KEY }}
      - name: Install ocb
        timeout-minutes: 10
        run: bash .github/scripts/retry.sh make install-ocb
      - name: Build
        run: make build-darwin
      - name: Install lichen
        timeout-minutes: 10
        run: bash .github/scripts/retry.sh go install github.com/uw-labs/lichen@v0.1.7
      - name: Scan Third Party Dependency Licenses
        run: lichen --config=./license.yaml $(find dist/collector_* dist/updater_*)
  build_windows:
    if: github.actor != 'dependabot[bot]'
    runs-on:
      group: bindplane-large
      labels: ubuntu-latest-4-cores
    steps:
      - name: Checkout Sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: internal/extension/opampconnectionextension/go.mod
          cache-dependency-path: |
            go.sum
            **/go.sum
      - name: Grant access to private Dynatrace Go modules
        uses: ./.github/actions/private-go-modules
        with:
          app-id: ${{ vars.PRIVATE_GO_MODULES_APP_ID }}
          private-key: ${{ secrets.PRIVATE_GO_MODULES_APP_PRIVATE_KEY }}
      - name: Install ocb
        timeout-minutes: 10
        run: bash .github/scripts/retry.sh make install-ocb
      - name: Build
        run: make build-windows
      - name: Install lichen
        timeout-minutes: 10
        run: bash .github/scripts/retry.sh go install github.com/uw-labs/lichen@v0.1.7
      - name: Scan Third Party Dependency Licenses
        run: lichen --config=./license.yaml dist/collector_windows_amd64.exe dist/updater_windows_amd64.exe dist/collector_windows_arm64.exe dist/updater_windows_arm64.exe
