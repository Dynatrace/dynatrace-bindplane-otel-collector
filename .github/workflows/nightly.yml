name: Nightly Build

# Nightly test builds of the collector binary for all release platforms.
# Binaries are uploaded as workflow artifacts (2-day retention). Linux
# container images are pushed to ghcr.io/dynatrace/dbdot-nightly — a
# package separate from the release images (ghcr.io/dynatrace/dbdot).
# No updater, packaging, or signing.
on:
  schedule:
    # 06:00 UTC daily; scheduled runs always use the default branch.
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      edge_components_ref:
        description: >
          Git ref (branch, tag, or SHA) of
          Dynatrace/dt-otelcol-edge-processing-components to build the
          collector with. Empty = version pinned in the manifest.
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  nightly:
    runs-on:
      group: bindplane-large
      labels: ubuntu-latest-32-cores
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # version ldflags derive from git tags

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: internal/extension/opampconnectionextension/go.mod
          cache: false

      - name: Cache Go modules
        uses: actions/cache@v6
        with:
          path: /home/runner/go/pkg/mod
          key: ${{ runner.os }}-go-mod-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-mod-

      - name: Grant access to private Dynatrace Go modules
        uses: ./.github/actions/private-go-modules
        with:
          app-id: ${{ vars.PRIVATE_GO_MODULES_APP_ID }}
          private-key: ${{ secrets.PRIVATE_GO_MODULES_APP_PRIVATE_KEY }}

      - name: Pin DT edge components to requested ref
        if: inputs.edge_components_ref != ''
        env:
          # The Makefile exports GOPRIVATE, but this step calls go directly.
          GOPRIVATE: github.com/Dynatrace/*
          EDGE_REF: ${{ inputs.edge_components_ref }}
        run: |
          MOD=github.com/Dynatrace/dt-otelcol-edge-processing-components/receiver/dtedgeprocessingreceiver
          # go list needs a module context; resolve the ref from a throwaway module.
          VERSION=$(cd "$(mktemp -d)" && go mod init resolve >/dev/null && go list -m "${MOD}@${EDGE_REF}" | awk '{print $2}')
          echo "Resolved ${EDGE_REF} -> ${VERSION}"
          yq -i ".replaces += [\"${MOD} => ${MOD} ${VERSION}\"]" manifests/dbdot/manifest.yaml

      - name: Install ocb
        run: make install-ocb

      - name: Build collector for all platforms
        run: make build-all-agent

      - name: Upload nightly binaries
        uses: actions/upload-artifact@v4
        with:
          name: nightly-binaries-${{ github.sha }}
          path: dist/
          retention-days: 2
          if-no-files-found: error

      # Container images: same Dockerfile and staging layout as the release
      # flow (.goreleaser-docker.yml), but built with plain buildx from the
      # binaries in dist/ — no goreleaser-pro, no GCS round-trip.
      - name: Stage container dependencies
        run: make release-prep CURR_VERSION=0.0.0-nightly

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push nightly container images
        env:
          IMAGE: ghcr.io/dynatrace/dbdot-nightly
          EDGE_REF: ${{ inputs.edge_components_ref }}
        run: |
          # Minimal build context (mirrors goreleaser's extra_files staging);
          # the repo root would ship build/, dist/, and .git/ to the daemon.
          mkdir -p ctx/release_deps ctx/config
          cp -r release_deps/plugins ctx/release_deps/plugins
          cp release_deps/config.yaml ctx/release_deps/config.yaml
          cp config/logging.stdout.yaml ctx/config/logging.stdout.yaml
          cp LICENSE ctx/

          ARCH_TAGS=""
          for ARCH in amd64 arm64; do
            cp "dist/collector_linux_${ARCH}" ctx/dbdot-collector
            docker buildx build --push \
              --platform "linux/${ARCH}" \
              --file docker/Dockerfile.scratch \
              --label "revision=${GITHUB_SHA}" \
              --tag "${IMAGE}:${GITHUB_RUN_ID}-${ARCH}" \
              ctx
            ARCH_TAGS="${ARCH_TAGS} ${IMAGE}:${GITHUB_RUN_ID}-${ARCH}"
          done

          # Experimental edge-ref builds get their own tag so they can never
          # overwrite the real nightly under :latest or the commit sha.
          if [ -n "${EDGE_REF}" ]; then
            TAG_ARGS="--tag ${IMAGE}:edge-${GITHUB_RUN_ID}"
          else
            TAG_ARGS="--tag ${IMAGE}:latest --tag ${IMAGE}:${GITHUB_SHA}"
          fi
          docker buildx imagetools create ${TAG_ARGS} ${ARCH_TAGS}
