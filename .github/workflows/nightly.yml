name: Nightly Build

# Nightly test builds of the collector binary for all release platforms.
# Artifacts stay on GitHub (workflow artifacts, 2-day retention); no
# updater, packaging, signing, or publishing to external infrastructure.
on:
  schedule:
    # 06:00 UTC daily; scheduled runs always use the default branch.
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      edge_components_ref:
        description: >
          Git ref (branch, tag, or SHA) of
          Dynatrace/dt-otelcol-edge-processing-components to build the
          collector with. Empty = version pinned in the manifest.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  nightly:
    runs-on:
      group: bindplane-large
      labels: ubuntu-latest-32-cores
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # version ldflags derive from git tags

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: internal/extension/opampconnectionextension/go.mod
          cache: false

      - name: Cache Go modules
        uses: actions/cache@v6
        with:
          path: /home/runner/go/pkg/mod
          key: ${{ runner.os }}-go-mod-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-mod-

      - name: Grant access to private Dynatrace Go modules
        uses: ./.github/actions/private-go-modules
        with:
          app-id: ${{ vars.PRIVATE_GO_MODULES_APP_ID }}
          private-key: ${{ secrets.PRIVATE_GO_MODULES_APP_PRIVATE_KEY }}

      - name: Pin DT edge components to requested ref
        if: inputs.edge_components_ref != ''
        env:
          # The Makefile exports GOPRIVATE, but this step calls go directly.
          GOPRIVATE: github.com/Dynatrace/*
          EDGE_REF: ${{ inputs.edge_components_ref }}
        run: |
          MOD=github.com/Dynatrace/dt-otelcol-edge-processing-components/receiver/dtedgeprocessingreceiver
          # go list needs a module context; resolve the ref from a throwaway module.
          VERSION=$(cd "$(mktemp -d)" && go mod init resolve >/dev/null && go list -m "${MOD}@${EDGE_REF}" | awk '{print $2}')
          echo "Resolved ${EDGE_REF} -> ${VERSION}"
          yq -i ".replaces += [\"${MOD} => ${MOD} ${VERSION}\"]" manifests/dbdot/manifest.yaml

      - name: Install ocb
        run: make install-ocb

      - name: Build collector for all platforms
        run: make build-all-agent

      - name: Upload nightly binaries
        uses: actions/upload-artifact@v4
        with:
          name: nightly-binaries-${{ github.sha }}
          path: dist/
          retention-days: 2
          if-no-files-found: error
