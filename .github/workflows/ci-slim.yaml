name: CI - DBDOT slim

on:
  # GitHub ignores paths filters for merge_group, so the merge queue always
  # runs this workflow. Intended: every merge is built.
  merge_group:
  workflow_dispatch:
  push:
    branches:
      - main
    # Shared with pull_request below via a YAML anchor.
    paths: &paths
      - "manifests/dynatrace-bindplane-otel-collector-slim/**"
      - "extension/**"
      - "pkg/**"
      - "Makefile"
      - "config/example.yaml"
      - "config/logging.stdout.yaml"
      - ".github/workflows/base-ci.yaml"
      - ".github/workflows/ci-slim.yaml"
      # Docs-only changes do not need a build.
      - "!**/*.md"
  pull_request:
    branches:
      - main
    paths: *paths

# Cancel a PR's previous run when it gets a new push. Runs on main are never
# cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    name: CI - DBDOT slim
    # The slim manifest has no private Go modules.
    uses: ./.github/workflows/base-ci.yaml
    with:
      distro: slim
    secrets:
      GRAPHITE_CI_OPTIMIZER_TOKEN: ${{ secrets.GRAPHITE_CI_OPTIMIZER_TOKEN }}
