name: Package Tests
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Build snapshot deb and rpm packages the same way as `make release-test`.
  build:
    runs-on:
      group: bindplane-large
      labels: ubuntu-latest-32-cores
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Tags are required to determine the snapshot version.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: extension/opampconnectionextension/go.mod
          cache: false # Caching handled by the actions/cache step below
      - name: Set up Go cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - name: Grant access to private Dynatrace Go modules
        uses: ./.github/actions/private-go-modules
        with:
          app-id: ${{ vars.PRIVATE_GO_MODULES_APP_ID }}
          private-key: ${{ secrets.PRIVATE_GO_MODULES_APP_PRIVATE_KEY }}

      - name: Install ocb
        timeout-minutes: 10
        run: bash .github/scripts/retry.sh make install-ocb

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser-pro
          version: "v2.12.5"
          install-only: true

      - name: Build snapshot packages
        run: make release-test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}

      - name: Upload Linux packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-packages
          path: |
            dist/metadata.json
            dist/artifacts.json
            dist/*_linux_amd64.deb
            dist/*_linux_amd64.rpm
            dist/*_linux_arm64.deb
            dist/*_linux_arm64.rpm
          if-no-files-found: error
          retention-days: 1

  # Run each distro and action in its own job, natively on each architecture.
  # distro must match a Name in test/packaging/distros_test.go. openSUSE runs
  # on amd64 only.
  test:
    name: test (${{ matrix.distro }}, ${{ matrix.action }}, ${{ matrix.arch }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        distro: [debian-13, ubuntu-26.04, rocky-10, opensuse-leap-16.0]
        action: [install, upgrade]
        arch: [amd64, arm64]
        exclude:
          - distro: opensuse-leap-16.0
            arch: arm64
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: test/packaging/go.mod
          cache-dependency-path: test/packaging/go.sum

      - name: Download Linux packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-packages
          path: dist

      - name: Run package tests
        run: make test-packages
        env:
          PKGTEST_DISTRO: ${{ matrix.distro }}
          PKGTEST_ACTION: ${{ matrix.action }}
