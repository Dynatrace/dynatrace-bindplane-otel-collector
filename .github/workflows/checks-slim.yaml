name: Checks - DBDOT slim

on:
  # GitHub ignores paths filters for merge_group, so the merge queue always
  # runs this workflow.
  merge_group:
  workflow_dispatch:
  push:
    branches:
      - main
    # Shared with pull_request below via a YAML anchor.
    paths: &paths
      - "manifests/dynatrace-bindplane-otel-collector-slim/**"
      - "extension/**"
      - "pkg/**"
      - "**/go.mod"
      - "**/go.sum"
      - "Makefile"
      - "scripts/check-version-consistency.sh"
      - ".github/workflows/base-checks.yaml"
      - ".github/workflows/checks-slim.yaml"
      # Docs-only changes do not need checking.
      - "!**/*.md"
  pull_request:
    branches:
      - main
    paths: *paths

# Cancel a PR's previous run when it gets a new push. Runs on main are never
# cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    name: Checks - DBDOT slim
    # The slim manifest has no private Go modules.
    uses: ./.github/workflows/base-checks.yaml
    with:
      distro: slim
      extra_checks: check-slim-feature-gates
    secrets:
      GRAPHITE_CI_OPTIMIZER_TOKEN: ${{ secrets.GRAPHITE_CI_OPTIMIZER_TOKEN }}
