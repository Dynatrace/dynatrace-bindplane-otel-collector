name: E2E-Test
on:
  pull_request:

permissions:
  contents: read

# Superseded PR pushes are cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
env:
  KUBECONFIG: /tmp/kube-config-collector-e2e-testing

jobs:
  detect-changes:
    uses: ./.github/workflows/detect-changes.yaml

  build:
    runs-on: ubuntu-24.04
    needs: [detect-changes]
    if: needs.detect-changes.outputs.skip != 'true'
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: extension/opampconnectionextension/go.mod
          cache-dependency-path: |
            extension/opampconnectionextension/go.sum
            internal/testbed/integration/go.sum

      - name: Grant access to private Dynatrace Go modules
        uses: ./.github/actions/private-go-modules
        with:
          app-id: ${{ vars.PRIVATE_GO_MODULES_APP_ID }}
          private-key: ${{ secrets.PRIVATE_GO_MODULES_APP_PRIVATE_KEY }}

      - name: Install ocb
        run: make install-ocb

      - name: Build collector artifact
        run: GOOS=linux GOARCH=amd64 make agent

      - name: Upload binary artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dynatrace-bindplane-otel-collector-bin
          path: dist/collector_linux_amd64

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build collector image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./dist
          file: internal/testbed/docker/Dockerfile
          push: false
          load: true
          tags: dynatrace-bindplane-otel-collector:e2e-test

      - name: export image to tar
        run: |
          docker save dynatrace-bindplane-otel-collector:e2e-test > /tmp/dynatrace-bindplane-otel-collector.tar

      - name: Upload container image artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dynatrace-bindplane-otel-collector-image
          path: /tmp/dynatrace-bindplane-otel-collector.tar

      - name: Build journald image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./dist
          file: internal/testbed/docker/Dockerfile-journald
          push: false
          load: true
          tags: dynatrace-bindplane-otel-collector-journald:e2e-test

      - name: Export journald image to tar
        run: |
          docker save dynatrace-bindplane-otel-collector-journald:e2e-test > /tmp/dynatrace-bindplane-otel-collector-journald.tar

      - name: Upload journald container image artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dynatrace-bindplane-otel-collector-journald-image
          path: /tmp/dynatrace-bindplane-otel-collector-journald.tar

  k8s-multinode-matrix:
    strategy:
      fail-fast: false
      matrix:
        usecase:
          - k8scombined
          - prometheus-large-scale
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup cluster
        uses: ./.github/actions/create-cluster
        with:
          config: "./.github/actions/create-cluster/multi-node.yaml"
          go-cache-dependency-path: internal/testbed/integration/go.sum

      - name: Fetch config examples
        run: make e2e-config-examples

      - name: Run e2e tests
        run: |
          cd internal/testbed/integration/${{ matrix.usecase }}
          go test -v

  k8s-e2e-test-matrix:
    strategy:
      fail-fast: false
      matrix:
        usecase:
          - k8sbearertokenauth
          - k8scluster
          - k8senrichment
          - k8sobjects
          - k8spodlogs
          - k8sselfmonitoring
          - kubeletstats
          - loadbalancing
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup cluster
        uses: ./.github/actions/create-cluster
        with:
          go-cache-dependency-path: internal/testbed/integration/go.sum

      - name: Fetch config examples
        run: make e2e-config-examples

      - name: Run e2e tests
        run: |
          cd internal/testbed/integration/${{ matrix.usecase }}
          go test -v

  e2e-test-matrix:
    strategy:
      fail-fast: false
      matrix:
        path:
          - bearertokenauth
          - feature-flags
          - filestorage
          - genainormalizer
          - kafka
          - netflow
          - prometheus
          - redaction
          - statsd
          - self-monitoring
          - zipkin
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: extension/opampconnectionextension/go.mod
          cache-dependency-path: internal/testbed/integration/go.sum

      - name: Download artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dynatrace-bindplane-otel-collector-bin
          path: dist

      - run: chmod +x dist/*

      - name: Fetch config examples
        run: make e2e-config-examples

      - name: Run e2e tests
        run: |
          cd internal/testbed/integration/${{ matrix.path }}
          go test -v

  hostmetrics-e2e-test:
    name: Test Hostmetrics configuration
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup cluster
        uses: ./.github/actions/create-cluster
        with:
          go-cache-dependency-path: internal/testbed/integration/go.sum

      - name: Download journald image artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dynatrace-bindplane-otel-collector-journald-image
          path: /tmp

      - name: Load journald image into Kind
        run: |
          kind load image-archive /tmp/dynatrace-bindplane-otel-collector-journald.tar

      - name: Fetch config examples
        run: make e2e-config-examples

      - name: Run e2e tests
        run: |
          cd internal/testbed/integration/hostmetrics
          go test -v

  resource-detection-e2e-test:
    name: Test resource detection
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: extension/opampconnectionextension/go.mod
          cache-dependency-path: internal/testbed/integration/go.sum

      - name: Download image artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dynatrace-bindplane-otel-collector-image
          path: /tmp

      - name: Load image into Docker
        run: docker load -i /tmp/dynatrace-bindplane-otel-collector.tar

      - name: Fetch config examples
        run: make e2e-config-examples

      - name: Run e2e tests
        run: |
          cd internal/testbed/integration/resource-detection
          go test -v

  # Single required status check. Skipped jobs (docs-only changes)
  # count as success, failed or cancelled ones fail this job.
  e2e-success:
    name: E2E Success
    if: always()
    needs: [detect-changes, build, k8s-multinode-matrix, k8s-e2e-test-matrix, e2e-test-matrix, hostmetrics-e2e-test, resource-detection-e2e-test]
    runs-on: ubuntu-24.04
    steps:
      - name: Check results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          case " $RESULTS " in *" failure "*|*" cancelled "*) exit 1;; esac
