name: Reusable checks workflow

# Runs the manifest checks for one DBDOT distro (selected by `distro`, the
# Makefile's DISTRO). Called once per distro by the thin checks-<distro>.yaml
# workflows, mirroring base-ci.yaml and the per-distro `make check` of the
# upstream opentelemetry-collector-releases ci.yaml. Checks that do not depend
# on a manifest (fmt, lint, gosec, license, ...) stay in checks.yml.

on:
  workflow_call:
    inputs:
      distro:
        description: "Makefile DISTRO to check (full, slim)"
        required: true
        type: string
      extra_checks:
        description: "Space-separated make targets to run after verify-manifest, for checks only one distro has"
        required: false
        type: string
        default: ""
      runner_os:
        required: false
        type: string
        default: ubuntu-24.04
      private_go_modules:
        description: "Set to true when the distro's manifest pulls private Dynatrace Go modules"
        required: false
        type: boolean
        default: false
    secrets:
      PRIVATE_GO_MODULES_APP_PRIVATE_KEY:
        required: false
      GRAPHITE_CI_OPTIMIZER_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  # CI optimization: skip redundant CI runs for stacked PRs.
  # Graphite stacks: https://graphite.com/docs/stacking-and-ci
  # GitHub native stacks: https://docs.github.com/en/pull-requests/how-tos/merge-and-close-pull-requests/optimizing-ci-for-stacked-pull-requests
  optimize_ci:
    runs-on: ${{ inputs.runner_os }}
    continue-on-error: true
    outputs:
      skip: ${{ steps.graphite_check.outputs.skip == 'true' || steps.github_check.outputs.skip == 'true' }}
    steps:
      - name: Graphite CI optimization
        id: graphite_check
        continue-on-error: true
        uses: withgraphite/graphite-ci-action@402a89bc8aa6db18ae1f9c61953d001d5f9d828f # v0.0.11 tag (no formal releases)
        with:
          graphite_token: ${{ secrets.GRAPHITE_CI_OPTIMIZER_TOKEN }}
      - name: GitHub stacked PR optimization
        id: github_check
        if: github.event_name == 'pull_request'
        env:
          STACK_BASE: ${{ github.event.pull_request.stack.base.ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [[ -n "$STACK_BASE" && "$BASE_REF" != "$STACK_BASE" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

  check:
    # The calling workflow's name prefixes this (e.g. "Checks - DBDOT slim / ..."),
    # so the distro is not repeated here.
    name: Check manifest
    needs: optimize_ci
    if: ${{ needs.optimize_ci.outputs.skip != 'true' }}
    runs-on: ${{ inputs.runner_os }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reads every manifest, so drift is caught whichever distro's manifest
      # changed. Needs no Go toolchain, so it runs first.
      - name: Check component version consistency
        run: make check-version-consistency

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: extension/opampconnectionextension/go.mod
          # The check's modules are resolved from the ocb manifests, so key the
          # cache on them as well as the repo's go.sum files.
          cache-dependency-path: |
            **/go.sum
            manifests/**/manifest*.yaml

      - name: Grant access to private Dynatrace Go modules
        if: inputs.private_go_modules
        uses: ./.github/actions/private-go-modules
        with:
          app-id: ${{ vars.PRIVATE_GO_MODULES_APP_ID }}
          private-key: ${{ secrets.PRIVATE_GO_MODULES_APP_PRIVATE_KEY }}

      - name: Install ocb
        run: make install-ocb

      - name: Verify manifest
        run: make verify-manifest DISTRO="${DISTRO}"
        env:
          DISTRO: ${{ inputs.distro }}

      - name: Distro-specific checks
        if: inputs.extra_checks != ''
        run: |
          for target in ${EXTRA_CHECKS}; do
            echo "::group::make ${target}"
            make "${target}" DISTRO="${DISTRO}"
            echo "::endgroup::"
          done
        env:
          DISTRO: ${{ inputs.distro }}
          EXTRA_CHECKS: ${{ inputs.extra_checks }}
