name: release-containers
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Collector Version"
        required: true
        default: "v0.0.1"
  # Uncomment the following to automatically trigger this workflow after
  # the release workflow completes successfully on a version tag push.
  # When enabled, remove the manual version input above and replace
  # references to ${{ github.event.inputs.version }} with ${{ github.ref_name }},
  # since the triggering tag will be available directly on the context.
  #
  # workflow_run:
  #   workflows: ["release"]
  #   types: [completed]

permissions:
  contents: read

jobs:
  release-containers:
    permissions:
      contents: read
      packages: write
    runs-on:
      group: bindplane-large
      labels: ubuntu-latest-32-cores
    # Uncomment the following when switching to workflow_run trigger,
    # to ensure the job only runs if the release workflow succeeded.
    # if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Redirect temp directories
        run: |
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "GOTMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # For goreleaser
          fetch-depth: 0
      - name: Authenticate to GCP
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ secrets.DBDOT_GCS_RELEASE_BUCKET_PROJECT_ID }}
          credentials_json: ${{ secrets.DBDOT_GCS_RELEASE_BUCKET_CREDENTIALS }}
      - name: Download Linux Binaries from GCS
        run: |
          mkdir -p tmp
          VERSION=${{ github.event.inputs.version }}
          for ARCH in amd64 arm64 ppc64le; do
            ARCHIVE="dynatrace-bindplane-otel-collector-${VERSION}-linux-${ARCH}.tar.gz"
            gsutil cp "gs://dbdot-release/${VERSION}/${ARCHIVE}" tmp/
            mkdir -p "tmp/${ARCH}"
            tar -xzf "tmp/${ARCHIVE}" -C "tmp/${ARCH}" dynatrace-bindplane-otel-collector
            mv "tmp/${ARCH}/dynatrace-bindplane-otel-collector" "tmp/collector_linux_${ARCH}"
          done
      # Goreleaser builds the container-init binary itself; it just needs
      # a Go toolchain on the runner.
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: cmd/container-init/go.mod
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      # Images are currently published to GHCR only. When Docker Hub and
      # Google Artifact Registry publishing are added back under
      # Dynatrace-owned orgs/registries, restore the DockerHub and GAR
      # login steps here (docker/login-action) along with the image
      # templates in .goreleaser-docker.yml.
      - name: Login to Github Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Cache Goreleaser Build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/goreleaser
          key: ${{ runner.os }}-goreleaser-${{ hashFiles('.goreleaser-docker.yml', '**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-goreleaser-
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser-pro
          version: "v2.12.5"
          args: release --clean --timeout 120m --config .goreleaser-docker.yml
        env:
          GORELEASER_CURRENT_TAG: ${{ github.event.inputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
