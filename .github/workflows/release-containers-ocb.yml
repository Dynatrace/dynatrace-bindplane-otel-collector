name: release-containers-ocb
# Releases the standard (pure ocb-built) collector container images.
# Unlike release-containers, which downloads the managed-mode binaries
# produced by the release workflow from GCS, this workflow builds the
# collector from the release tag with ocb directly: no main.go overlay,
# no build tags.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Collector Version"
        required: true
        default: "v0.0.1"

permissions:
  contents: write
  packages: write

jobs:
  release-containers-ocb:
    runs-on:
      group: bindplane-large
      labels: ubuntu-latest-32-cores
    steps:
      - name: Redirect temp directories
        run: |
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "GOTMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          # Build from the release tag so the manifest matches the release.
          ref: ${{ github.event.inputs.version }}
          # For goreleaser
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: internal/extension/opampconnectionextension/go.mod
      - name: Install ocb
        run: make install-ocb
      - name: Build Collector Binaries
        run: make build-all-agent-ocb OUTDIR=tmp VERSION=${{ github.event.inputs.version }}
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to Github Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Login to Google Artifact Repository
        uses: docker/login-action@v2
        with:
          registry: us-central1-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.DBDOT_GAR_JSON_KEY }}
      - name: Cache Goreleaser Build
        uses: actions/cache@v6
        with:
          path: ~/.cache/goreleaser
          key: ${{ runner.os }}-goreleaser-ocb-${{ hashFiles('.goreleaser-docker-ocb.yml', '**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-goreleaser-ocb-
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser-pro
          version: "v2.12.5"
          args: release --clean --timeout 120m --config .goreleaser-docker-ocb.yml
        env:
          GORELEASER_CURRENT_TAG: ${{ github.event.inputs.version }}
          GAR_PROJECT_ID: ${{ vars.DBDOT_GAR_PROJECT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
