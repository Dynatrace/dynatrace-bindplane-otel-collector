name: Release Test
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Collector Version"
        required: true
        default: "v0.0.1"
      distro:
        description: "Build to rehearse the release for"
        required: true
        type: choice
        options:
          - full
          - slim
        default: full

permissions:
  contents: read

jobs:
  build-msi:
    if: ${{ inputs.distro == 'full' }}
    uses: ./.github/workflows/build-signed-windows.yml
    with:
      version: ${{ inputs.version }}
      sign_install_script: true
    secrets: inherit

  release-test:
    runs-on:
      group: bindplane-large
      labels: ubuntu-latest-32-cores
    needs: [build-msi, release-test-aix]
    # build-msi is skipped for slim; without a status function a skipped
    # dependency would skip this job too.
    if: ${{ !cancelled() && !failure() }}
    # id-token for the keyless cosign signatures of the full build.
    permissions:
      contents: read
      id-token: write
    env:
      PRODUCT: ${{ inputs.distro == 'slim' && 'dynatrace-bindplane-otel-collector-slim' || 'dynatrace-bindplane-otel-collector' }}
      GORELEASER_CONFIG: ${{ inputs.distro == 'slim' && 'manifests/dynatrace-bindplane-otel-collector-slim/.goreleaser.yml' || 'manifests/dynatrace-bindplane-otel-collector/.goreleaser.yml' }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: extension/opampconnectionextension/go.mod
          cache: false # Caching handled by the actions/cache step below
      - name: Set up Go cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - name: Grant access to private Dynatrace Go modules
        uses: ./.github/actions/private-go-modules
        with:
          app-id: ${{ vars.PRIVATE_GO_MODULES_APP_ID }}
          private-key: ${{ secrets.PRIVATE_GO_MODULES_APP_PRIVATE_KEY }}
      - name: Install ocb
        timeout-minutes: 10
        run: bash .github/scripts/retry.sh make install-ocb

      - name: Retrieve Windows AMD64 MSI Installer
        if: ${{ inputs.distro == 'full' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dynatrace-bindplane-otel-collector-amd64.msi

      - name: Retrieve Windows ARM64 MSI Installer
        if: ${{ inputs.distro == 'full' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dynatrace-bindplane-otel-collector-arm64.msi

      - name: Retrieve AIX Packages
        if: ${{ inputs.distro == 'full' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aix-dist
          path: aix-dist

      - name: Install cosign
        if: ${{ inputs.distro == 'full' }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4

      - name: Sign AMD64 MSI
        if: ${{ inputs.distro == 'full' }}
        run: cosign sign-blob --bundle ./dynatrace-bindplane-otel-collector-amd64.msi.sigstore.json --yes ./dynatrace-bindplane-otel-collector-amd64.msi
        shell: bash

      - name: Sign ARM64 MSI
        if: ${{ inputs.distro == 'full' }}
        run: cosign sign-blob --bundle ./dynatrace-bindplane-otel-collector-arm64.msi.sigstore.json --yes ./dynatrace-bindplane-otel-collector-arm64.msi
        shell: bash

      - name: Set VERSION
        run: echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_ENV

      - name: Cache Goreleaser Build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/goreleaser
          key: ${{ runner.os }}-goreleaser-${{ hashFiles(env.GORELEASER_CONFIG, '**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-goreleaser-

      # Staged into place by goreleaser's overlay before-hook, not here:
      # goreleaser validates git state before running its hooks, so touching
      # the tracked script from a workflow step fails the release with
      # "git is in a dirty state". The download directory is gitignored.
      - name: Retrieve Signed Windows Install Script
        if: ${{ inputs.distro == 'full' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-install-script
          path: signed-install-script
      # The Windows binaries goreleaser packages must be the signed ones from
      # the build-msi job, not the unsigned copies its before-hook builds here.
      - name: Retrieve Signed Windows Binaries
        if: ${{ inputs.distro == 'full' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: signed-windows-*
          merge-multiple: true
          path: signed-windows
      # Exported here instead of in the goreleaser step's env: the overlay script
      # treats a set-but-empty SIGNED_WINDOWS_DIR as an error, so for builds
      # without MSIs the variables must stay unset.
      - name: Export signed Windows paths
        if: ${{ inputs.distro == 'full' }}
        run: |
          echo "SIGNED_WINDOWS_DIR=signed-windows" >> "$GITHUB_ENV"
          echo "SIGNED_INSTALL_SCRIPT=signed-install-script/install_windows.ps1" >> "$GITHUB_ENV"
      - name: Install cyclonedx-gomod
        if: ${{ inputs.distro == 'slim' }}
        timeout-minutes: 10
        run: bash .github/scripts/retry.sh go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.12.0
      - name: Set up QEMU
        if: ${{ inputs.distro == 'slim' }}
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64,ppc64le
      - name: Set up Docker Buildx
        if: ${{ inputs.distro == 'slim' }}
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Write signing key for nFPM
        shell: bash
        run: |
          cat > ci-signing-key.asc <<'EOF'
          ${{ secrets.GPG_PRIVATE_SIGNING_KEY }}
          EOF
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser-pro
          version: "v2.12.5"
          # Slim also signs its container images by digest, which needs them to be
          # pushed, so its rehearsal skips signing.
          args: release --skip=publish --skip=validate${{ inputs.distro == 'slim' && ' --skip=sign' || '' }} --clean --config ${{ env.GORELEASER_CONFIG }}
        env:
          GORELEASER_CURRENT_TAG: ${{ env.VERSION }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
          SIGNING_KEY_FILE: ci-signing-key.asc

      - name: Debug list dist/
        run: |
          ls -laR dist/

      - name: Create artifact archives
        run: ./scripts/ci/create-artifact-bundles.sh ${{ github.event.inputs.version }} ${{ env.PRODUCT }}
        env:
          BUNDLE_INSTALLERS: ${{ inputs.distro == 'full' }}

      - name: Sign artifact archives
        if: ${{ inputs.distro == 'full' }}
        run: |
          for bundle in ./${{ env.PRODUCT }}-${{ github.event.inputs.version }}-artifacts*.tar.gz; do
            cosign sign-blob --bundle "$bundle.sigstore.json" --yes "$bundle"
          done
        shell: bash

      - name: Check Artifact Bundles
        run: |
          ls -la ${{ env.PRODUCT }}-${{ github.event.inputs.version }}-artifacts*.tar.gz*
          for dir in bundle-*; do
            echo "== $dir"
            ls -la "$dir"
            du -sh "$dir"
          done

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.PRODUCT }}-${{ github.event.inputs.version }}-artifacts.tar.gz
          path: ${{ env.PRODUCT }}-${{ github.event.inputs.version }}-artifacts.tar.gz
          retention-days: 1

      - name: Upload Linux build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.PRODUCT }}-${{ github.event.inputs.version }}-artifacts-linux.tar.gz
          path: ${{ env.PRODUCT }}-${{ github.event.inputs.version }}-artifacts-linux.tar.gz
          retention-days: 1

      - name: Upload macOS build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.PRODUCT }}-${{ github.event.inputs.version }}-artifacts-darwin.tar.gz
          path: ${{ env.PRODUCT }}-${{ github.event.inputs.version }}-artifacts-darwin.tar.gz
          retention-days: 1

      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.PRODUCT }}-${{ github.event.inputs.version }}-artifacts-windows.tar.gz
          path: ${{ env.PRODUCT }}-${{ github.event.inputs.version }}-artifacts-windows.tar.gz
          retention-days: 1

      - name: Upload AIX build artifacts
        if: ${{ inputs.distro == 'full' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dynatrace-bindplane-otel-collector-${{ github.event.inputs.version }}-artifacts-aix.tar.gz
          path: dynatrace-bindplane-otel-collector-${{ github.event.inputs.version }}-artifacts-aix.tar.gz
          retention-days: 1

  # AIX builds from its own goreleaser config and signs with the release keys.
  # The release-test job lists the packages in the main SHA256SUMS and the
  # artifact bundles.
  release-test-aix:
    # The slim build has no AIX package.
    if: ${{ inputs.distro == 'full' }}
    # id-token for the keyless cosign signature of the AIX packages.
    permissions:
      contents: read
      id-token: write
    runs-on:
      group: bindplane-large
      labels: ubuntu-latest-32-cores
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: extension/opampconnectionextension/go.mod
          cache: false # Caching handled by the actions/cache step below

      - name: Set up Go cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Grant access to private Dynatrace Go modules
        uses: ./.github/actions/private-go-modules
        with:
          app-id: ${{ vars.PRIVATE_GO_MODULES_APP_ID }}
          private-key: ${{ secrets.PRIVATE_GO_MODULES_APP_PRIVATE_KEY }}

      - name: Install ocb
        timeout-minutes: 10
        run: bash .github/scripts/retry.sh make install-ocb

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4

      # The AIX install path verifies a detached GPG signature, so goreleaser
      # signs with gpg as well as cosign.
      - name: Import GPG signing key
        shell: bash
        run: |
          echo "$GPG_PRIVATE_SIGNING_KEY" | gpg --batch --import
          echo "GPG_FINGERPRINT=$(gpg --list-secret-keys --with-colons | grep fpr | head -1 | cut -d: -f10)" >> "$GITHUB_ENV"
        env:
          GPG_PRIVATE_SIGNING_KEY: ${{ secrets.GPG_PRIVATE_SIGNING_KEY }}

      - name: Set VERSION
        run: echo "VERSION=${{ github.event.inputs.version }}" >> "$GITHUB_ENV"

      - name: Run GoReleaser (AIX)
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser-pro
          version: "v2.12.5"
          args: release --config manifests/dynatrace-bindplane-otel-collector/.goreleaser-aix.yml --skip=publish --skip=validate --clean
        env:
          GORELEASER_CURRENT_TAG: ${{ env.VERSION }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
          GPG_FINGERPRINT: ${{ env.GPG_FINGERPRINT }}

      - name: Upload AIX Packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aix-dist
          path: dist/*.tar.gz*
          if-no-files-found: error
          retention-days: 1

  # The rehearsal runs goreleaser with --skip=publish, so there is no GitHub
  # release to read. Verify the artifact bundle the release-test job uploads.
  verify-windows-release:
    if: ${{ inputs.distro == 'full' }}
    needs: [release-test]
    runs-on: windows-2022
    steps:
      - name: Checkout Sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download Artifact Bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dynatrace-bindplane-otel-collector-${{ inputs.version }}-artifacts.tar.gz
          path: bundle
      - name: Unpack Artifact Bundle
        run: |
          mkdir artifacts
          tar -xzvf "bundle/dynatrace-bindplane-otel-collector-$env:VERSION-artifacts.tar.gz" -C artifacts
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
      - name: Verify Windows Signatures
        run: ./scripts/ci/verify-windows-signatures.ps1 -Root ./artifacts
        shell: pwsh
