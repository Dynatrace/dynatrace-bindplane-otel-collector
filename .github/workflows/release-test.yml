name: Release Test
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Collector Version"
        required: true
        default: "v0.0.1"

permissions:
  contents: read

jobs:
  build-msi:
    uses: ./.github/workflows/build-signed-windows.yml
    with:
      version: ${{ inputs.version }}
      sign_install_script: true
    secrets: inherit

  release-test:
    runs-on:
      group: bindplane-large
      labels: ubuntu-latest-32-cores
    needs: [build-msi]
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: internal/extension/opampconnectionextension/go.mod
          cache: false # Caching handled by the actions/cache step below
      - name: Set up Go cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - name: Grant access to private Dynatrace Go modules
        uses: ./.github/actions/private-go-modules
        with:
          app-id: ${{ vars.PRIVATE_GO_MODULES_APP_ID }}
          private-key: ${{ secrets.PRIVATE_GO_MODULES_APP_PRIVATE_KEY }}
      - name: Install ocb
        timeout-minutes: 10
        run: bash .github/scripts/retry.sh make install-ocb

      - name: Retrieve Windows AMD64 MSI Installer
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dynatrace-bindplane-otel-collector-amd64.msi

      - name: Retrieve Windows ARM64 MSI Installer
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dynatrace-bindplane-otel-collector-arm64.msi

      - name: Install cosign
        timeout-minutes: 10
        run: bash .github/scripts/retry.sh go install github.com/sigstore/cosign/cmd/cosign@v1.13.1
      - name: Build cosign key file
        run: 'echo "$COSIGN_PRIVATE_KEY" >> cosign.key'
        shell: bash
        env:
          COSIGN_PRIVATE_KEY: ${{secrets.COSIGN_PRIVATE_KEY}}

      - name: Sign AMD64 MSI
        run: cosign sign-blob --key=cosign.key --output-signature ./dynatrace-bindplane-otel-collector-amd64.msi.sig ./dynatrace-bindplane-otel-collector-amd64.msi
        shell: bash
        env:
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PWD }}

      - name: Sign ARM64 MSI
        run: cosign sign-blob --key=cosign.key --output-signature ./dynatrace-bindplane-otel-collector-arm64.msi.sig ./dynatrace-bindplane-otel-collector-arm64.msi
        shell: bash
        env:
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PWD }}

      - name: Set VERSION
        run: echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_ENV

      - name: Cache Goreleaser Build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/goreleaser
          key: ${{ runner.os }}-goreleaser-${{ hashFiles('.goreleaser.yml', '**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-goreleaser-

      # Staged into place by goreleaser's overlay before-hook, not here:
      # goreleaser validates git state before running its hooks, so touching
      # the tracked script from a workflow step fails the release with
      # "git is in a dirty state". The download directory is gitignored.
      - name: Retrieve Signed Windows Install Script
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-install-script
          path: signed-install-script
      # The Windows binaries goreleaser packages must be the signed ones from
      # the build-msi job, not the unsigned copies its before-hook builds here.
      - name: Retrieve Signed Windows Binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: signed-windows-*
          merge-multiple: true
          path: signed-windows
      - name: Write signing key for nFPM
        shell: bash
        run: |
          cat > ci-signing-key.asc <<'EOF'
          ${{ secrets.GPG_PRIVATE_SIGNING_KEY }}
          EOF
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser-pro
          version: "v2.12.5"
          args: release --skip=publish --skip=validate --clean
        env:
          GORELEASER_CURRENT_TAG: ${{ env.VERSION }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
          SIGNED_WINDOWS_DIR: signed-windows
          SIGNED_INSTALL_SCRIPT: signed-install-script/install_windows.ps1
          SIGNING_KEY_FILE: ci-signing-key.asc
          COSIGN_PWD: ${{ secrets.COSIGN_PWD }}

      - name: Debug list dist/
        run: |
          ls -laR dist/

      - name: Create artifact archive
        run: |
          mkdir artifacts
          cp ./scripts/install/*.sh ./artifacts
          cp ./scripts/install/*.ps1 ./artifacts
          cp ./release_deps/gpg-keys.tar.gz ./artifacts/gpg-keys.tar.gz
          cp ./dynatrace-bindplane-otel-collector-amd64.msi ./artifacts
          cp ./dynatrace-bindplane-otel-collector-arm64.msi ./artifacts
          cp ./dist/*tar.gz ./artifacts
          cp ./dist/*.zip ./artifacts
          cp ./dist/*.rpm ./artifacts
          cp ./dist/*.deb ./artifacts
          cp ./dist/*SHA256SUMS ./artifacts
          tar -czvf dynatrace-bindplane-otel-collector-${{ github.event.inputs.version }}-artifacts.tar.gz -C ./artifacts .

      - name: Sign artifact archive
        run: cosign sign-blob --key=cosign.key --output-signature ./dynatrace-bindplane-otel-collector-${{ github.event.inputs.version }}-artifacts.tar.gz.sig ./dynatrace-bindplane-otel-collector-${{ github.event.inputs.version }}-artifacts.tar.gz
        shell: bash
        env:
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PWD }}

      - name: Check Artifacts Directory
        run: |
          ls -la artifacts
          du -sh artifacts

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dynatrace-bindplane-otel-collector-${{ github.event.inputs.version }}-artifacts.tar.gz
          path: dynatrace-bindplane-otel-collector-${{ github.event.inputs.version }}-artifacts.tar.gz
          retention-days: 1

  # The rehearsal runs goreleaser with --skip=publish, so there is no GitHub
  # release to read. Verify the artifact bundle the release-test job uploads.
  verify-windows-release:
    needs: [release-test]
    runs-on: windows-2022
    steps:
      - name: Checkout Sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download Artifact Bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dynatrace-bindplane-otel-collector-${{ inputs.version }}-artifacts.tar.gz
          path: bundle
      - name: Unpack Artifact Bundle
        run: |
          mkdir artifacts
          tar -xzvf "bundle/dynatrace-bindplane-otel-collector-$env:VERSION-artifacts.tar.gz" -C artifacts
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
      - name: Verify Windows Signatures
        run: ./scripts/ci/verify-windows-signatures.ps1 -Root ./artifacts
        shell: pwsh
