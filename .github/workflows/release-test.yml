name: Release Test

# Rehearses the release of the full build. Runs the same pipeline as
# release-full.yml (the reusable base-release.yml) as a dry run: goreleaser skips
# publishing and nothing is uploaded to a release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Collector Version"
        required: true
        default: "v0.0.1"

permissions:
  contents: read

jobs:
  release-test:
    permissions:
      contents: write
    uses: ./.github/workflows/base-release.yml
    with:
      product: dynatrace-bindplane-otel-collector
      version-check-mode: exact
      version: ${{ inputs.version }}
      dry-run: true
      build-msi: true
    secrets: inherit
