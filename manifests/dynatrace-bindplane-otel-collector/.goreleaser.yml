version: 2

# Lets `goreleaser release --split` (goreleaser-pro, used by the snapshot
# workflows) build one GOOS/GOARCH target per job instead of one GOOS. Ignored
# without --split.
partial:
  by: target

project_name: dynatrace-bindplane-otel-collector

before:
  hooks:
    - make release-prep-gpg CURR_VERSION={{ .Version }}
    # Build collector + updater binaries via ocb-driven `make`. Goreleaser
    # picks them up below via `builder: prebuilt`. VERSION is passed so the
    # stamped version doesn't depend on git tags or the caller's environment.
    - make build-all-non-aix OUTDIR="tmp" VERSION=v{{ .Version }}
    # Replace the Windows binaries just built here with the Authenticode-signed
    # copies from the build-signed-windows workflow. This runner has no DigiCert
    # access, so without the overlay the Windows zip would ship unsigned
    # executables (BPOP-5780). No-op when SIGNED_WINDOWS_DIR is unset, which is
    # how local snapshot builds work; fails the release when it is set but the
    # signed binaries are missing.
    - ./scripts/ci/overlay-signed-windows.sh tmp

after:
  hooks:
    - cmd: rm -rf tmp

# https://goreleaser.com/customization/build/
#
# `ldflags`, `tags`, and `main` are no longer set here — the Make targets own
# them (`AGENT_LDFLAGS` / `UPDATER_LDFLAGS` + `-tags $(AGENT_BUILD_TAGS)`,
# i.e. `embed_library`). Goreleaser only packages the pre-built
# binaries.
builds:
  - id: collector
    builder: prebuilt
    binary: dynatrace-bindplane-otel-collector
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
      - arm
      - ppc64
      - ppc64le
    ignore:
      - goos: darwin
        goarch: ppc64
      - goos: darwin
        goarch: ppc64le
      - goos: windows
        goarch: arm
      - goos: windows
        goarch: ppc64
      - goos: windows
        goarch: ppc64le
    prebuilt:
      path: tmp/collector_{{ .Os }}_{{ .Arch }}{{ .Ext }}
  - id: updater
    builder: prebuilt
    binary: updater
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
      - arm
      - ppc64
      - ppc64le
    ignore:
      - goos: darwin
        goarch: ppc64
      - goos: darwin
        goarch: ppc64le
      - goos: windows
        goarch: arm
      - goos: windows
        goarch: ppc64
      - goos: windows
        goarch: ppc64le
    prebuilt:
      path: tmp/updater_{{ .Os }}_{{ .Arch }}{{ .Ext }}
  # Built by goreleaser itself, only the container images use it.
  - id: container-init
    dir: cmd/container-init
    binary: container-init
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
    goos:
      - linux
    goarch:
      - amd64
      - arm64
      - ppc64le

# https://goreleaser.com/customization/archive/
archives:
  - ids:
      - collector
      - updater
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}-v{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    files:
      - LICENSE
      - src: release_deps/config.yaml
        dst: "."
        strip_parent: true
      - src: release_deps/logging.yaml
        dst: "."
        strip_parent: true
      - src: release_deps/plugins/*
        dst: plugins
        strip_parent: true
      - src: release_deps/VERSION.txt
        dst: "."
        strip_parent: true
      - src: release_deps/com.dynatrace.bindplane.otel.collector.plist
        dst: "install"
        strip_parent: true
      - src: release_deps/gpg-keys.tar.gz
        dst: "."
        strip_parent: true
      - src: release_deps/windows_service.json
        dst: install
        strip_parent: true

nfpms:
  - id: collector
    ids:
      - collector
      - updater
    file_name_template: "{{ .PackageName }}_v{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    package_name: dynatrace-bindplane-otel-collector
    vendor: Dynatrace LLC
    maintainer: Dynatrace LLC <support@bindplane.com>
    description: Dynatrace Bindplane Distribution of OpenTelemetry Collector
    homepage: https://github.com/dynatrace/dynatrace-bindplane-otel-collector
    license: Apache 2.0
    formats:
      - rpm
      - deb
    bindir: /usr/share/dynatrace-bindplane-otel-collector/stage/dynatrace-bindplane-otel-collector
    deb:
      signature:
        key_file: "{{ .Env.SIGNING_KEY_FILE }}"
    rpm:
      signature:
        key_file: "{{ .Env.SIGNING_KEY_FILE }}"
    contents:
      - dst: /usr/share/dynatrace-bindplane-otel-collector/stage/dynatrace-bindplane-otel-collector
        type: dir
        file_info:
          mode: 0750
          owner: root
          group: root
      - src: release_deps/config.yaml
        dst: /usr/share/dynatrace-bindplane-otel-collector/stage/dynatrace-bindplane-otel-collector/config.yaml
        file_info:
          mode: 0640
          owner: root
          group: root
      - src: release_deps/logging.yaml
        dst: /usr/share/dynatrace-bindplane-otel-collector/stage/dynatrace-bindplane-otel-collector/logging.yaml
        file_info:
          mode: 0640
          owner: root
          group: root
      - src: LICENSE
        dst: /usr/share/dynatrace-bindplane-otel-collector/stage/dynatrace-bindplane-otel-collector/LICENSE
        file_info:
          mode: 0644
          owner: root
          group: root
      - src: release_deps/VERSION.txt
        dst: /usr/share/dynatrace-bindplane-otel-collector/stage/dynatrace-bindplane-otel-collector/VERSION.txt
        file_info:
          mode: 0644
          owner: root
          group: root
      - dst: /usr/share/dynatrace-bindplane-otel-collector/stage/dynatrace-bindplane-otel-collector/plugins
        type: dir
        file_info:
          mode: 0750 # restrict plugins to owner / group only
          owner: root
          group: root
      # Note: plugins owner/group/mode is set in the post-install script
      # Attempting to set the permissions here results in the following error:
      # nfpm failed: cannot write header of release_deps/plugins/amazon_eks.yaml to data.tar.gz: archive/tar: missed writing 1736 bytes
      - src: release_deps/plugins/*
        dst: /usr/share/dynatrace-bindplane-otel-collector/stage/dynatrace-bindplane-otel-collector/plugins
      # Storage dir is used by stateful receivers, such as file_log receiver. It allows
      # receivers to track their progress and buffer data.
      - dst: /usr/share/dynatrace-bindplane-otel-collector/stage/dynatrace-bindplane-otel-collector/storage
        type: dir
        file_info:
          mode: 0750
          owner: root
          group: root
      - dst: /usr/share/dynatrace-bindplane-otel-collector/stage/dynatrace-bindplane-otel-collector/log
        type: dir
        file_info:
          mode: 0750
          owner: root
          group: root
    scripts:
      preinstall: ./scripts/package/preinstall.sh
      postinstall: ./scripts/package/postinstall.sh
      preremove: ./scripts/package/preremove.sh
      postremove: ./scripts/package/postremove.sh

# https://goreleaser.com/customization/checksum/
checksum:
  name_template: "{{ .ProjectName }}-v{{ .Version }}-SHA256SUMS"
  algorithm: sha256
  extra_files:
    - glob: "./dynatrace-bindplane-otel-collector*.msi"
    - glob: "./aix-dist/*.tar.gz"

# https://goreleaser.com/customization/sign/
# Keyless signing: cosign gets an ephemeral certificate from Fulcio using the
# workflow's OIDC token and writes everything needed to verify into one sigstore
# bundle per artifact.
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    artifacts: all
    output: true
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"

# Container images: a scratch image per architecture, pushed to GHCR, plus a
# multi-arch manifests for the version tag and for `latest`. Both builds publish to the same image
# repository with the same naming scheme and OCI labels. The tags tell them
# apart: full tags are `<version>`, `<version>-<arch>` and `latest`, slim tags carry the
# `-slim` suffix (see the slim .goreleaser.yml).
dockers:
  - id: scratch-amd64
    goos: linux
    goarch: amd64
    retry:
      attempts: 10
      delay: 30s
      max_delay: 1m
    ids:
      - collector
      - container-init
    image_templates:
      - "ghcr.io/dynatrace/dynatrace-bindplane-otel-collector:{{ .Version }}-amd64"
    dockerfile: ./docker/Dockerfile.scratch
    use: buildx
    build_flag_templates:
      - "--label=org.opencontainers.image.created={{.Date}}"
      - "--label=org.opencontainers.image.title={{.ProjectName}}"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.version={{.Version}}"
      - "--label=org.opencontainers.image.source={{.GitURL}}"
      - "--label=org.opencontainers.image.licenses=Apache-2.0"
      - "--platform=linux/amd64"
    extra_files:
      - release_deps/plugins
      - release_deps/config.yaml
      - config/logging.stdout.yaml
      - LICENSE
  - id: scratch-arm64
    goos: linux
    goarch: arm64
    retry:
      attempts: 10
      delay: 30s
      max_delay: 1m
    ids:
      - collector
      - container-init
    image_templates:
      - "ghcr.io/dynatrace/dynatrace-bindplane-otel-collector:{{ .Version }}-arm64"
    dockerfile: ./docker/Dockerfile.scratch
    use: buildx
    build_flag_templates:
      - "--label=org.opencontainers.image.created={{.Date}}"
      - "--label=org.opencontainers.image.title={{.ProjectName}}"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.version={{.Version}}"
      - "--label=org.opencontainers.image.source={{.GitURL}}"
      - "--label=org.opencontainers.image.licenses=Apache-2.0"
      - "--platform=linux/arm64"
    extra_files:
      - release_deps/plugins
      - release_deps/config.yaml
      - config/logging.stdout.yaml
      - LICENSE
  - id: scratch-ppc64le
    goos: linux
    goarch: ppc64le
    retry:
      attempts: 10
      delay: 30s
      max_delay: 1m
    ids:
      - collector
      - container-init
    image_templates:
      - "ghcr.io/dynatrace/dynatrace-bindplane-otel-collector:{{ .Version }}-ppc64le"
    dockerfile: ./docker/Dockerfile.scratch
    use: buildx
    build_flag_templates:
      - "--label=org.opencontainers.image.created={{.Date}}"
      - "--label=org.opencontainers.image.title={{.ProjectName}}"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.version={{.Version}}"
      - "--label=org.opencontainers.image.source={{.GitURL}}"
      - "--label=org.opencontainers.image.licenses=Apache-2.0"
      - "--platform=linux/ppc64le"
    extra_files:
      - release_deps/plugins
      - release_deps/config.yaml
      - config/logging.stdout.yaml
      - LICENSE

docker_manifests:
  - name_template: "ghcr.io/dynatrace/dynatrace-bindplane-otel-collector:{{ .Version }}"
    image_templates:
      - "ghcr.io/dynatrace/dynatrace-bindplane-otel-collector:{{ .Version }}-amd64"
      - "ghcr.io/dynatrace/dynatrace-bindplane-otel-collector:{{ .Version }}-arm64"
      - "ghcr.io/dynatrace/dynatrace-bindplane-otel-collector:{{ .Version }}-ppc64le"
  - name_template: "ghcr.io/dynatrace/dynatrace-bindplane-otel-collector:latest"
    image_templates:
      - "ghcr.io/dynatrace/dynatrace-bindplane-otel-collector:{{ .Version }}-amd64"
      - "ghcr.io/dynatrace/dynatrace-bindplane-otel-collector:{{ .Version }}-arm64"
      - "ghcr.io/dynatrace/dynatrace-bindplane-otel-collector:{{ .Version }}-ppc64le"

# Keyless signing of every image and manifest by digest.
docker_signs:
  - cmd: cosign
    artifacts: all
    output: true
    args:
      - sign
      - "${artifact}@${digest}"
      - "--yes"

# Digests of all pushed images and manifests, attested by the release workflow.
docker_digest:
  name_template: "digests.txt"

# https://goreleaser.com/customization/release/
release:
  draft: false

  # publish to a prerelease first
  prerelease: "true"
  extra_files:
    - glob: "./dynatrace-bindplane-otel-collector*.msi"
    - glob: "./dynatrace-bindplane-otel-collector*.msi.sigstore.json"
    - glob: "./aix-dist/*"
    - glob: "./scripts/install/install_unix.sh"
    - glob: "./scripts/install/install_macos.sh"
    - glob: "./scripts/install/install_windows.ps1"
    - glob: "./release_deps/gpg-keys.tar.gz"

# https://console.cloud.google.com/storage/browser/dbdot-release
blobs:
  - provider: gs
    bucket: dbdot-release
    directory: "v{{ .Version }}"
    extra_files:
      - glob: "./dynatrace-bindplane-otel-collector*.msi"
      - glob: "./dynatrace-bindplane-otel-collector*.msi.sigstore.json"
      - glob: "./aix-dist/*"
      - glob: "./scripts/install/install_unix.sh"
      - glob: "./scripts/install/install_macos.sh"
      - glob: "./scripts/install/install_windows.ps1"
      - glob: "./release_deps/gpg-keys.tar.gz"

# Slim tags (slim/vX.Y.Z-rc.N) belong to the slim build. Skip them when looking
# up the previous tag, so the changelog covers everything since the last full
# release.
git:
  ignore_tags:
    - "slim/*"

# https://goreleaser.com/customization/changelog/
changelog:
  use: github
  sort: asc
  groups:
    - title: "New Features"
      regexp: "^.*feat[(\\w)]*:+.*$"
      order: 0
    - title: "Bug Fixes"
      regexp: "^.*fix[(\\w)]*:+.*$"
      order: 10
    - title: "Dependencies"
      regexp: "^.*deps[(\\w)]*:+.*$"
      order: 30
    - title: Other
      order: 999
