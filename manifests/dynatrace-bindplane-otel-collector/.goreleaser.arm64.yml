version: 2

project_name: dynatrace-bindplane-otel-collector

before:
  hooks:
    - make release-prep CURR_VERSION={{ .Version }}
    # Pre-build the linux/arm64 binary via ocb-driven `make`. Goreleaser runs
    # hooks without a shell, so GOOS/GOARCH go in `env`, not as a command prefix.
    - cmd: make build-binaries OUTDIR=tmp
      env:
        - GOOS=linux
        - GOARCH=arm64

after:
  hooks:
    - cmd: rm -rf tmp

# `builder: prebuilt` — Make owns the build (`AGENT_LDFLAGS`,
# `-tags $(AGENT_BUILD_TAGS)`, i.e. `bindplane embed_library`).
builds:
  - id: collector
    builder: prebuilt
    binary: dynatrace-bindplane-otel-collector
    goos:
      - linux
    goarch:
      - arm64
    prebuilt:
      path: tmp/collector_{{ .Os }}_{{ .Arch }}{{ .Ext }}
  - id: container-init
    dir: cmd/container-init
    binary: container-init
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
    goos:
      - linux
    goarch:
      - arm64

dockers:
  - id: scratch-arm64
    goos: linux
    goarch: arm64
    retry:
      attempts: 10
      delay: 30s
      max_delay: 1m
    ids:
      - collector
      - container-init
    # Same naming scheme as the release images in .goreleaser.yml.
    image_templates:
      - "ghcr.io/dynatrace/dynatrace-bindplane-otel-collector:{{ .Version }}-arm64"
    dockerfile: ./docker/Dockerfile.scratch
    use: buildx
    build_flag_templates:
      - "--label=org.opencontainers.image.created={{.Date}}"
      - "--label=org.opencontainers.image.title={{.ProjectName}}"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.version={{.Version}}"
      - "--label=org.opencontainers.image.source={{.GitURL}}"
      - "--label=org.opencontainers.image.licenses=Apache-2.0"
      - "--platform=linux/arm64"
    extra_files:
      - release_deps/plugins
      - release_deps/config.yaml
      - config/logging.stdout.yaml
      - LICENSE

changelog:
  disable: true
