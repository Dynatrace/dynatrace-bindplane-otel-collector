version: 2

project_name: dynatrace-bindplane-otel-collector

before:
  hooks:
    - make release-prep CURR_VERSION={{ .Version }}

# https://goreleaser.com/customization/build/
# https://goreleaser.com/customization/builds/#import-pre-built-binaries
builds:
  - id: collector
    builder: prebuilt
    binary: dynatrace-bindplane-otel-collector
    goos:
      - linux
    goarch:
      - amd64
      - arm64
      - ppc64le
    prebuilt:
      path: tmp/collector_{{ .Os }}_{{ .Arch }}
  - id: container-init
    dir: cmd/container-init
    binary: container-init
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
    goos:
      - linux
    goarch:
      - amd64
      - arm64
      - ppc64le

# Container images and manifests are the only intended output of this config.
# Without the three stanzas below, goreleaser applies its defaults: a tar.gz per
# linux arch, a checksums file over them, and an upload of all of it to the GitHub
# release for the tag. Those archives hold just the binaries and goreleaser's default
# doc files, so they duplicate (less completely) the archives .goreleaser.yml already
# publishes, and they ship unsigned.
archives:
  - formats: [binary]

checksum:
  disable: true

release:
  disable: true

# Build container images with docker buildx (mutli arch builds).
# A single scratch-based image per arch: collector binary, passwd/group,
# CA certificates, and the /etc/otel runtime tree only.
#
# Images are currently published to GHCR only. Docker Hub and Google
# Artifact Registry publishing should be added back once Dynatrace-owned
# orgs/registries exist for them, e.g.:
#   - "dynatrace/dynatrace-bindplane-otel-collector-<arch>:{{ .Version }}"
#   - "us-central1-docker.pkg.dev/{{ .Env.GAR_PROJECT_ID }}/collector/dynatrace-bindplane-otel-collector-<arch>:{{ .Version }}"
# (plus the matching docker_manifests entries and registry logins in
# .github/workflows/release-containers.yml).
dockers:
  - id: scratch-amd64
    goos: linux
    goarch: amd64
    retry:
      attempts: 10
      delay: 30s
      max_delay: 1m
    ids:
      - collector
      - container-init
    image_templates:
      - "ghcr.io/dynatrace/dynatrace-bindplane-otel-collector-amd64:{{ .Version }}"
    dockerfile: ./docker/Dockerfile.scratch
    use: buildx
    build_flag_templates:
      - "--label=created={{.Date}}"
      - "--label=title={{.ProjectName}}"
      - "--label=revision={{.FullCommit}}"
      - "--label=version={{.Version}}"
      - "--platform=linux/amd64"
    extra_files:
      - release_deps/plugins
      - release_deps/config.yaml
      - config/logging.stdout.yaml
      - LICENSE
  - id: scratch-arm64
    goos: linux
    goarch: arm64
    retry:
      attempts: 10
      delay: 30s
      max_delay: 1m
    ids:
      - collector
      - container-init
    image_templates:
      - "ghcr.io/dynatrace/dynatrace-bindplane-otel-collector-arm64:{{ .Version }}"
    dockerfile: ./docker/Dockerfile.scratch
    use: buildx
    build_flag_templates:
      - "--label=created={{.Date}}"
      - "--label=title={{.ProjectName}}"
      - "--label=revision={{.FullCommit}}"
      - "--label=version={{.Version}}"
      - "--platform=linux/arm64"
    extra_files:
      - release_deps/plugins
      - release_deps/config.yaml
      - config/logging.stdout.yaml
      - LICENSE
  - id: scratch-ppc64le
    goos: linux
    goarch: ppc64le
    retry:
      attempts: 10
      delay: 30s
      max_delay: 1m
    ids:
      - collector
      - container-init
    image_templates:
      - "ghcr.io/dynatrace/dynatrace-bindplane-otel-collector-ppc64le:{{ .Version }}"
    dockerfile: ./docker/Dockerfile.scratch
    use: buildx
    build_flag_templates:
      - "--label=created={{.Date}}"
      - "--label=title={{.ProjectName}}"
      - "--label=revision={{.FullCommit}}"
      - "--label=version={{.Version}}"
      - "--platform=linux/ppc64le"
    extra_files:
      - release_deps/plugins
      - release_deps/config.yaml
      - config/logging.stdout.yaml
      - LICENSE

docker_manifests:
  - name_template: "ghcr.io/dynatrace/dynatrace-bindplane-otel-collector:{{ .Version }}"
    image_templates:
      - "ghcr.io/dynatrace/dynatrace-bindplane-otel-collector-amd64:{{ .Version }}"
      - "ghcr.io/dynatrace/dynatrace-bindplane-otel-collector-arm64:{{ .Version }}"
      - "ghcr.io/dynatrace/dynatrace-bindplane-otel-collector-ppc64le:{{ .Version }}"
    skip_push: false
changelog:
  # Set this to true if you don't want any changelog at all.
  #
  # Warning: this will also ignore any changelog files passed via `--release-notes`,
  # and will render an empty changelog.
  #
  # This may result in an empty release notes on GitHub/GitLab/Gitea.
  #
  # Templates: allowed.
  disable: true
