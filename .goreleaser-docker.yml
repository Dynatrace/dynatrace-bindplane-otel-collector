version: 2

project_name: dbdot-collector

before:
  hooks:
    - make release-prep CURR_VERSION={{ .Version }}

# Nightly builds (nightly.yml runs `goreleaser release --nightly`) share this
# config. Nightly mode needs no tag at HEAD and creates no GitHub release; it
# still builds and pushes docker images/manifests, retargeted below via
# {{ .IsNightly }} at the separate ghcr.io/dynatrace/dbdot-nightly* packages.
# The nightly workflow must set two env vars:
#   NIGHTLY_TAG         image tag — commit sha, or edge-<ref> for builds
#                       pinned to an edge-components git ref
#   NIGHTLY_PUSH_LATEST "true" to also move dbdot-nightly:latest; edge-ref
#                       builds set "false" so they can't masquerade as the
#                       real nightly
nightly:
  version_template: "{{ incpatch .Version }}-{{ .ShortCommit }}-nightly"

# https://goreleaser.com/customization/build/
# https://goreleaser.com/customization/builds/#import-pre-built-binaries
builds:
  - id: collector
    builder: prebuilt
    binary: dbdot-collector
    goos:
      - linux
    goarch:
      - amd64
      - arm64
      - ppc64le
    prebuilt:
      path: tmp/collector_{{ .Os }}_{{ .Arch }}

# Build container images with docker buildx (mutli arch builds).
# A single scratch-based image per arch: collector binary, passwd/group,
# CA certificates, and the /etc/otel runtime tree only.
#
# Images are currently published to GHCR only. Docker Hub and Google
# Artifact Registry publishing should be added back once Dynatrace-owned
# orgs/registries exist for them, e.g.:
#   - "dynatrace/dbdot-<arch>:{{ .Version }}"
#   - "us-central1-docker.pkg.dev/{{ .Env.GAR_PROJECT_ID }}/collector/dbdot-<arch>:{{ .Version }}"
# (plus the matching docker_manifests entries and registry logins in
# .github/workflows/release-containers.yml).
dockers:
  - id: scratch-amd64
    goos: linux
    goarch: amd64
    retry:
      attempts: 10
      delay: 30s
      max_delay: 1m
    ids:
      - collector
    image_templates:
      - "{{ if .IsNightly }}ghcr.io/dynatrace/dbdot-nightly-amd64:{{ .Env.NIGHTLY_TAG }}{{ else }}ghcr.io/dynatrace/dbdot-amd64:{{ .Version }}{{ end }}"
    dockerfile: "./docker/Dockerfile{{ if .IsNightly }}.nightly{{ else }}.scratch{{ end }}"
    use: buildx
    build_flag_templates:
      - "--label=created={{.Date}}"
      - "--label=title={{.ProjectName}}"
      - "--label=revision={{.FullCommit}}"
      - "--label=version={{.Version}}"
      - "--platform=linux/amd64"
    extra_files:
      - release_deps/plugins
      - release_deps/config.yaml
      - config/logging.stdout.yaml
      - LICENSE
  - id: scratch-arm64
    goos: linux
    goarch: arm64
    retry:
      attempts: 10
      delay: 30s
      max_delay: 1m
    ids:
      - collector
    image_templates:
      - "{{ if .IsNightly }}ghcr.io/dynatrace/dbdot-nightly-arm64:{{ .Env.NIGHTLY_TAG }}{{ else }}ghcr.io/dynatrace/dbdot-arm64:{{ .Version }}{{ end }}"
    dockerfile: "./docker/Dockerfile{{ if .IsNightly }}.nightly{{ else }}.scratch{{ end }}"
    use: buildx
    build_flag_templates:
      - "--label=created={{.Date}}"
      - "--label=title={{.ProjectName}}"
      - "--label=revision={{.FullCommit}}"
      - "--label=version={{.Version}}"
      - "--platform=linux/arm64"
    extra_files:
      - release_deps/plugins
      - release_deps/config.yaml
      - config/logging.stdout.yaml
      - LICENSE
  - id: scratch-ppc64le
    goos: linux
    goarch: ppc64le
    # Nightlies ship amd64/arm64 only.
    skip_build: "{{ .IsNightly }}"
    skip_push: "{{ .IsNightly }}"
    retry:
      attempts: 10
      delay: 30s
      max_delay: 1m
    ids:
      - collector
    image_templates:
      - "ghcr.io/dynatrace/dbdot-ppc64le:{{ .Version }}"
    dockerfile: "./docker/Dockerfile{{ if .IsNightly }}.nightly{{ else }}.scratch{{ end }}"
    use: buildx
    build_flag_templates:
      - "--label=created={{.Date}}"
      - "--label=title={{.ProjectName}}"
      - "--label=revision={{.FullCommit}}"
      - "--label=version={{.Version}}"
      - "--platform=linux/ppc64le"
    extra_files:
      - release_deps/plugins
      - release_deps/config.yaml
      - config/logging.stdout.yaml
      - LICENSE

docker_manifests:
  # Release manifest — skipped on nightlies.
  - name_template: "ghcr.io/dynatrace/dbdot:{{ .Version }}"
    image_templates:
      - "ghcr.io/dynatrace/dbdot-amd64:{{ .Version }}"
      - "ghcr.io/dynatrace/dbdot-arm64:{{ .Version }}"
      - "ghcr.io/dynatrace/dbdot-ppc64le:{{ .Version }}"
    skip_push: "{{ .IsNightly }}"
  # Nightly manifests — skipped on releases. Templates must render a valid
  # (if meaningless) name in release mode too, hence the :unused fallbacks;
  # skip_push keeps them from ever being pushed there.
  - name_template: "{{ if .IsNightly }}ghcr.io/dynatrace/dbdot-nightly:{{ .Env.NIGHTLY_TAG }}{{ else }}ghcr.io/dynatrace/dbdot-nightly:unused{{ end }}"
    image_templates:
      - "{{ if .IsNightly }}ghcr.io/dynatrace/dbdot-nightly-amd64:{{ .Env.NIGHTLY_TAG }}{{ else }}ghcr.io/dynatrace/dbdot-nightly-amd64:unused{{ end }}"
      - "{{ if .IsNightly }}ghcr.io/dynatrace/dbdot-nightly-arm64:{{ .Env.NIGHTLY_TAG }}{{ else }}ghcr.io/dynatrace/dbdot-nightly-arm64:unused{{ end }}"
    skip_push: "{{ not .IsNightly }}"
  # Rolling latest — only for real nightlies, never edge-ref builds.
  - name_template: "ghcr.io/dynatrace/dbdot-nightly:latest"
    image_templates:
      - "{{ if .IsNightly }}ghcr.io/dynatrace/dbdot-nightly-amd64:{{ .Env.NIGHTLY_TAG }}{{ else }}ghcr.io/dynatrace/dbdot-nightly-amd64:unused{{ end }}"
      - "{{ if .IsNightly }}ghcr.io/dynatrace/dbdot-nightly-arm64:{{ .Env.NIGHTLY_TAG }}{{ else }}ghcr.io/dynatrace/dbdot-nightly-arm64:unused{{ end }}"
    skip_push: "{{ if .IsNightly }}{{ if eq .Env.NIGHTLY_PUSH_LATEST \"true\" }}false{{ else }}true{{ end }}{{ else }}true{{ end }}"
changelog:
  # Set this to true if you don't want any changelog at all.
  #
  # Warning: this will also ignore any changelog files passed via `--release-notes`,
  # and will render an empty changelog.
  #
  # This may result in an empty release notes on GitHub/GitLab/Gitea.
  #
  # Templates: allowed.
  disable: true
